<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fe0000">
<title>Ordini · Macelleria Bonaconza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3ead9;
    --paper-2:#ece0c9;
    --ink:#221c18;
    --ink-soft:#5c4f44;
    --blood:#fe0000;
    --blood-2:#d40000;
    --line:#d8c9ad;
    --late:#b3261e;
    --today:#c2700f;
    --ready:#2f7d32;
    --done:#8a7e6e;
    --shadow:0 2px 0 rgba(34,28,24,.08), 0 8px 24px -10px rgba(34,28,24,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Hanken Grotesk',system-ui,sans-serif;
    background:
      repeating-linear-gradient(45deg, rgba(125,29,27,.018) 0 2px, transparent 2px 22px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 14px 120px;}

  /* Header */
  header{
    position:sticky;top:0;z-index:30;
    margin:0 -14px 14px;padding:14px 16px 12px;
    background:var(--blood);
    color:#f7eedd;
    box-shadow:0 6px 18px -8px rgba(0,0,0,.5);
    border-bottom:3px solid #c41212;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand h1{
    font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.5px;
    margin:0;font-size:22px;text-transform:uppercase;line-height:1;
  }
  .brand .tag{font-size:12px;opacity:.8;font-weight:500;margin-top:3px;letter-spacing:.3px;}
  .cleaver{font-size:24px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.3));}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
  .stat{
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);
    border-radius:10px;padding:8px 6px;text-align:center;
  }
  .stat .n{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;line-height:1;}
  .stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.6px;opacity:.85;margin-top:3px;}
  .stat.late .n{color:#ffd2cd;}
  .stat.today .n{color:#ffdca0;}
  .stat.ready .n{color:#bfe6c0;}

  /* Toolbar */
  .toolbar{display:flex;gap:8px;margin-bottom:12px;}
  .search{flex:1;position:relative;}
  .search input{
    width:100%;padding:12px 12px 12px 38px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;font-size:16px;font-family:inherit;color:var(--ink);
  }
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;}
  .btn{
    border:none;border-radius:10px;font-family:'Oswald',sans-serif;font-weight:600;
    letter-spacing:.4px;text-transform:uppercase;cursor:pointer;font-size:14px;
    padding:0 16px;display:inline-flex;align-items:center;gap:6px;
  }
  .btn-add{background:var(--blood-2);color:#fff;box-shadow:var(--shadow);}
  .btn-add:active{transform:translateY(1px);}

  /* Section */
  .section{margin-bottom:18px;}
  .section h2{
    font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;text-transform:uppercase;
    letter-spacing:1px;margin:0 0 8px;display:flex;align-items:center;gap:8px;color:var(--ink-soft);
  }
  .section h2 .dot{width:9px;height:9px;border-radius:50%;}
  .section h2 .cnt{
    margin-left:auto;font-size:12px;background:var(--paper-2);border:1px solid var(--line);
    border-radius:20px;padding:1px 9px;color:var(--ink-soft);
  }
  .sec-late h2{color:var(--late);} .sec-late .dot{background:var(--late);}
  .sec-today h2{color:var(--today);} .sec-today .dot{background:var(--today);}
  .sec-domani .dot{background:#6b7d2f;}
  .sec-prossimi .dot{background:var(--ink-soft);}
  .sec-done h2{color:var(--done);} .sec-done .dot{background:var(--done);}

  /* Card */
  .card{
    background:#fffdf8;border:1.5px solid var(--line);border-left:5px solid var(--ink-soft);
    border-radius:12px;padding:12px 13px;margin-bottom:10px;box-shadow:var(--shadow);
  }
  .card.b-ritardo{border-left-color:var(--late);}
  .card.b-oggi{border-left-color:var(--today);}
  .card.b-domani{border-left-color:#6b7d2f;}
  .card.b-prossimi{border-left-color:var(--ink-soft);}
  .card.b-consegnati{border-left-color:var(--done);opacity:.72;}
  .card-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .card .cliente{font-family:'Oswald',sans-serif;font-weight:600;font-size:18px;line-height:1.1;}
  .card .when{font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
  .card .when.late{color:var(--late);}
  .card .prodotti{margin:7px 0 2px;font-size:15px;white-space:pre-wrap;line-height:1.35;}
  .card .note{font-size:13px;color:var(--ink-soft);font-style:italic;margin-top:4px;}
  .card .tel{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
    padding:2px 7px;border-radius:20px;vertical-align:middle;margin-left:6px;}
  .badge.da_preparare{background:#fbe9d3;color:#9a560b;}
  .badge.pronto{background:#dcefdd;color:#1f5e22;}
  .badge.consegnato{background:#e6e0d6;color:#6d6356;}

  .actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .act{
    flex:1;min-width:64px;border:1.5px solid var(--line);background:#fff;border-radius:8px;
    padding:9px 6px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:5px;color:var(--ink);
  }
  .act:active{transform:translateY(1px);}
  .act.primary{background:var(--ready);border-color:var(--ready);color:#fff;}
  .act.amber{background:var(--today);border-color:var(--today);color:#fff;}
  .act.wa{background:#25693f;border-color:#25693f;color:#fff;}
  .act.ghost{flex:0 0 auto;min-width:44px;}
  .act.danger{color:var(--late);}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty .big{font-size:40px;margin-bottom:8px;}

  /* Footer tools */
  .footer-tools{display:flex;gap:8px;justify-content:center;margin-top:24px;}
  .footer-tools .btn{background:var(--paper-2);color:var(--ink-soft);border:1px solid var(--line);font-size:12px;padding:9px 14px;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(34,28,24,.55);z-index:50;display:none;
    align-items:flex-end;justify-content:center;}
  .overlay.open{display:flex;}
  .sheet{
    background:var(--paper);width:100%;max-width:680px;border-radius:18px 18px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
    box-shadow:0 -10px 40px -10px rgba(0,0,0,.5);animation:up .22s ease;
  }
  @keyframes up{from{transform:translateY(40px);opacity:.6;}to{transform:none;opacity:1;}}
  .sheet h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.5px;margin:0 0 14px;font-size:20px;color:var(--blood);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field textarea{
    width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
    font-size:16px;font-family:inherit;color:var(--ink);
  }
  .field textarea{min-height:74px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .sheet-actions{display:flex;gap:10px;margin-top:8px;}
  .sheet-actions .btn{flex:1;padding:14px;font-size:15px;justify-content:center;}
  .btn-save{background:var(--blood-2);color:#fff;}
  .btn-cancel{background:var(--paper-2);color:var(--ink-soft);border:1px solid var(--line);}

  .toast{
    position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:30px;font-size:14px;font-weight:600;
    z-index:80;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* FAB */
  .fab{
    position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;
    width:62px;height:62px;border-radius:50%;border:none;background:var(--blood-2);color:#fff;
    font-size:34px;line-height:1;cursor:pointer;box-shadow:0 8px 22px -6px rgba(125,29,27,.7);
    display:flex;align-items:center;justify-content:center;
  }
  .fab:active{transform:scale(.94);}

  .logo-wrap{display:flex;justify-content:center;align-items:center;position:relative;padding:4px 0 10px;}
  .logo-wrap .logo{height:118px;width:auto;max-width:92%;display:block;}
  .demo-badge{position:absolute;top:4px;right:2px;background:#fff;color:#fe0000;font-family:'Oswald',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;padding:3px 9px;border-radius:6px;transform:rotate(3deg);box-shadow:0 2px 6px rgba(0,0,0,.35);}
  .banner{display:none;align-items:center;gap:10px;background:#fff3d0;border:1.5px solid #e6c65a;border-radius:12px;padding:11px 13px;margin-bottom:12px;box-shadow:var(--shadow);}
  .banner.show{display:flex;}
  .banner .bell{font-size:20px;}
  .banner span#bannerTxt{font-weight:700;color:#8a6d00;flex:1;font-size:14px;}
  .banner button{border:none;background:var(--brand-2);color:#fff;border-radius:8px;padding:8px 12px;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.5px;cursor:pointer;}
  .badge.nuovo{background:var(--brand-2);color:#fff;}
  .origine{font-size:12px;color:var(--brand-2);font-weight:600;margin-top:3px;}
  .mode{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:12px;}
</style>
</head>

<script>
"use strict";
var STORAGE_KEY = "bonaconza_banco_cache";
var orders = [];
var SHOP_NAME = "Macelleria Bonaconza";

/* ---------- PURE LOGIC (testabile) ---------- */
function pad(n){ return n < 10 ? "0"+n : ""+n; }

function dateToISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

function todayISO(){ return dateToISO(new Date()); }

function addDaysISO(iso, days){
  var p = iso.split("-");
  var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  d.setDate(d.getDate()+days);
  return dateToISO(d);
}

// bucket: ritardo | oggi | domani | prossimi | consegnati
function classifyBucket(order, today){
  if(order.stato === "consegnato") return "consegnati";
  if(!order.ritiro) return "prossimi";
  if(order.ritiro < today) return "ritardo";
  if(order.ritiro === today) return "oggi";
  if(order.ritiro === addDaysISO(today, 1)) return "domani";
  return "prossimi";
}

function compareOrders(a, b){
  var ra = a.ritiro || "9999-99-99";
  var rb = b.ritiro || "9999-99-99";
  if(ra !== rb) return ra < rb ? -1 : 1;
  var oa = a.ora || "99:99";
  var ob = b.ora || "99:99";
  if(oa !== ob) return oa < ob ? -1 : 1;
  return (a.creato||0) - (b.creato||0);
}

function computeStats(list, today){
  var s = { ritardo:0, oggi:0, pronti:0 };
  for(var i=0;i<list.length;i++){
    var o = list[i];
    var b = classifyBucket(o, today);
    if(b === "ritardo") s.ritardo++;
    if(b === "oggi") s.oggi++;
    if(o.stato === "pronto" && b !== "consegnati") s.pronti++;
  }
  return s;
}

function nextStatus(s){
  if(s === "da_preparare") return "pronto";
  if(s === "pronto") return "consegnato";
  return "da_preparare";
}

function statoLabel(s){
  if(s === "da_preparare") return "Da preparare";
  if(s === "pronto") return "Pronto";
  if(s === "consegnato") return "Consegnato";
  return s;
}

function formatDateHuman(iso){
  if(!iso) return "—";
  var p = iso.split("-");
  var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  var giorni = ["dom","lun","mar","mer","gio","ven","sab"];
  var mesi = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
  return giorni[d.getDay()]+" "+d.getDate()+" "+mesi[d.getMonth()];
}

function matchesQuery(order, q){
  if(!q) return true;
  q = q.toLowerCase();
  return (order.cliente||"").toLowerCase().indexOf(q) >= 0
      || (order.prodotti||"").toLowerCase().indexOf(q) >= 0;
}

function buildWhatsAppMessage(order){
  var when = formatDateHuman(order.ritiro);
  if(order.ora) when += " alle " + order.ora;
  var msg = "Ciao " + (order.cliente||"") + "! 🥩\n";
  msg += "Confermo il tuo ordine:\n" + (order.prodotti||"") + "\n";
  msg += "Pronto per " + when + ".\n";
  msg += "A presto, " + SHOP_NAME;
  return msg;
}

function cleanPhone(tel){
  if(!tel) return "";
  var t = tel.replace(/[^0-9+]/g, "");
  if(t.indexOf("+") === 0) return t.slice(1);
  if(t.indexOf("00") === 0) return t.slice(2);
  if(t.length === 10 && t.charAt(0) === "3") return "39"+t; // cellulare IT senza prefisso
  return t;
}

function waLink(order){
  var text = encodeURIComponent(buildWhatsAppMessage(order));
  var ph = cleanPhone(order.tel);
  return ph ? "https://wa.me/"+ph+"?text="+text : "https://wa.me/?text="+text;
}

function groupOrders(list, today, query){
  var buckets = { ritardo:[], oggi:[], domani:[], prossimi:[], consegnati:[] };
  for(var i=0;i<list.length;i++){
    if(!matchesQuery(list[i], query)) continue;
    buckets[classifyBucket(list[i], today)].push(list[i]);
  }
  for(var k in buckets){ buckets[k].sort(compareOrders); }
  return buckets;
}

function newId(){ return "o_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7); }

/* ---------- STORE (cloud o offline) ---------- */
var STORE = null;
function applyOrders(arr){ orders = arr; render(); }

var localStore = {
  onChange:null,
  init:function(cb){ this.onChange=cb; this.reload(); },
  reload:function(){
    var arr=[];
    try{ var raw=localStorage.getItem(STORAGE_KEY); arr=raw?JSON.parse(raw):[]; if(!Array.isArray(arr))arr=[]; }catch(e){ arr=[]; }
    orders=arr; if(this.onChange) this.onChange(orders);
  },
  persist:function(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(orders)); }catch(e){} },
  add:function(o){ o.id=newId(); o.stato="da_preparare"; o.origine="banco"; o.nuovo=false; o.creato=Date.now(); orders.push(o); this.persist(); if(this.onChange) this.onChange(orders); },
  update:function(id,patch){ var o=findOrder(id); if(o){ for(var k in patch) o[k]=patch[k]; } this.persist(); if(this.onChange) this.onChange(orders); },
  remove:function(id){ orders=orders.filter(function(x){ return x.id!==id; }); this.persist(); if(this.onChange) this.onChange(orders); }
};
function countNuovi(){ return orders.filter(function(o){ return o.nuovo; }).length; }
function updateNuoviBanner(){
  var n=countNuovi(); var b=document.getElementById("banner");
  if(!b) return;
  if(n>0){ b.classList.add("show"); document.getElementById("bannerTxt").textContent = (n===1?"1 nuovo ordine dai clienti":(n+" nuovi ordini dai clienti")); }
  else { b.classList.remove("show"); }
}
function acknowledgeNew(){
  var ids=orders.filter(function(o){return o.nuovo;}).map(function(o){return o.id;});
  ids.forEach(function(id){ STORE.update(id,{nuovo:false}); });
  if(ids.length) toast(ids.length+" ordini segnati visti");
}

/* ---------- RENDER ---------- */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}

var SECTIONS = [
  {key:"ritardo",   title:"In ritardo", cls:"sec-late"},
  {key:"oggi",      title:"Oggi",       cls:"sec-today"},
  {key:"domani",    title:"Domani",     cls:"sec-domani"},
  {key:"prossimi",  title:"Prossimi",   cls:"sec-prossimi"},
  {key:"consegnati",title:"Consegnati", cls:"sec-done"}
];

function render(){
  var today = todayISO();
  var q = document.getElementById("search").value.trim();
  var stats = computeStats(orders, today);
  document.getElementById("stLate").textContent = stats.ritardo;
  document.getElementById("stToday").textContent = stats.oggi;
  document.getElementById("stReady").textContent = stats.pronti;
  updateNuoviBanner();

  var groups = groupOrders(orders, today, q);
  var html = "";
  var anyShown = false;

  for(var s=0;s<SECTIONS.length;s++){
    var sec = SECTIONS[s];
    var arr = groups[sec.key];
    if(arr.length === 0) continue;
    anyShown = true;
    html += '<div class="section '+sec.cls+'"><h2><span class="dot"></span>'+sec.title+
            '<span class="cnt">'+arr.length+'</span></h2>';
    for(var i=0;i<arr.length;i++){ html += cardHTML(arr[i], sec.key, today); }
    html += '</div>';
  }

  if(!anyShown){
    if(orders.length === 0){
      html = '<div class="empty"><div class="big">📋</div><strong>Nessun ordine</strong><br>'+
             'Tocca + per aggiungere il primo ordine.</div>';
    } else {
      html = '<div class="empty"><div class="big">🔍</div>Nessun risultato per "'+esc(q)+'".</div>';
    }
  }
  document.getElementById("list").innerHTML = html;
}

function cardHTML(o, bucket, today){
  var late = bucket === "ritardo";
  var when = formatDateHuman(o.ritiro) + (o.ora ? " · "+o.ora : "");
  var h = '<div class="card b-'+bucket+'">';
  var nuovoBadge = o.nuovo ? '<span class="badge nuovo">NUOVO</span>' : '';
  h += '<div class="card-top"><div class="cliente">'+esc(o.cliente)+nuovoBadge+
       '<span class="badge '+o.stato+'">'+statoLabel(o.stato)+'</span></div>'+
       '<div class="when'+(late?' late':'')+'">'+esc(when)+'</div></div>';
  if(o.origine==="cliente") h += '<div class="origine">\ud83d\uded2 ordine online</div>';
  h += '<div class="prodotti">'+esc(o.prodotti)+'</div>';
  if(o.note) h += '<div class="note">📝 '+esc(o.note)+'</div>';
  if(o.tel)  h += '<div class="tel">📞 '+esc(o.tel)+'</div>';

  h += '<div class="actions">';
  if(o.stato === "da_preparare"){
    h += '<button class="act amber" onclick="advance(\''+o.id+'\')">✓ Segna pronto</button>';
  } else if(o.stato === "pronto"){
    h += '<button class="act primary" onclick="advance(\''+o.id+'\')">✓ Consegnato</button>';
  } else {
    h += '<button class="act" onclick="advance(\''+o.id+'\')">↺ Riapri</button>';
  }
  h += '<a class="act wa" href="'+waLink(o)+'" target="_blank" rel="noopener">WhatsApp</a>';
  h += '<button class="act ghost" onclick="openForm(\''+o.id+'\')" aria-label="Modifica">✎</button>';
  h += '<button class="act ghost danger" onclick="removeOrder(\''+o.id+'\')" aria-label="Elimina">🗑</button>';
  h += '</div></div>';
  return h;
}

/* ---------- ACTIONS ---------- */
function findOrder(id){
  for(var i=0;i<orders.length;i++){ if(orders[i].id === id) return orders[i]; }
  return null;
}
function advance(id){
  var o = findOrder(id);
  if(!o) return;
  var ns = nextStatus(o.stato);
  STORE.update(id, {stato:ns, nuovo:false});
  toast("Stato: "+statoLabel(ns));
}
function removeOrder(id){
  var o = findOrder(id);
  if(!o) return;
  if(!confirm("Eliminare l'ordine di "+o.cliente+"?")) return;
  STORE.remove(id);
  toast("Ordine eliminato");
}

function openForm(id){
  var ov = document.getElementById("overlay");
  if(id){
    var o = findOrder(id);
    if(!o) return;
    document.getElementById("formTitle").textContent = "Modifica ordine";
    document.getElementById("fId").value = o.id;
    document.getElementById("fCliente").value = o.cliente||"";
    document.getElementById("fProdotti").value = o.prodotti||"";
    document.getElementById("fData").value = o.ritiro||"";
    document.getElementById("fOra").value = o.ora||"";
    document.getElementById("fTel").value = o.tel||"";
    document.getElementById("fNote").value = o.note||"";
  } else {
    document.getElementById("formTitle").textContent = "Nuovo ordine";
    document.getElementById("fId").value = "";
    document.getElementById("fCliente").value = "";
    document.getElementById("fProdotti").value = "";
    document.getElementById("fData").value = todayISO();
    document.getElementById("fOra").value = "";
    document.getElementById("fTel").value = "";
    document.getElementById("fNote").value = "";
  }
  ov.classList.add("open");
}
function closeForm(){ document.getElementById("overlay").classList.remove("open"); }

function saveForm(){
  var cliente = document.getElementById("fCliente").value.trim();
  var prodotti = document.getElementById("fProdotti").value.trim();
  var ritiro = document.getElementById("fData").value;
  if(!cliente){ toast("Inserisci il cliente"); return; }
  if(!prodotti){ toast("Inserisci i prodotti"); return; }
  if(!ritiro){ toast("Inserisci la data di ritiro"); return; }

  var id = document.getElementById("fId").value;
  var data = {
    cliente: cliente,
    prodotti: prodotti,
    ritiro: ritiro,
    ora: document.getElementById("fOra").value,
    tel: document.getElementById("fTel").value.trim(),
    note: document.getElementById("fNote").value.trim()
  };

  if(id){
    STORE.update(id, data);
    toast("Ordine aggiornato");
  } else {
    STORE.add(data);
    toast("Ordine aggiunto");
  }
  closeForm();
}

/* ---------- BACKUP ---------- */
function exportData(){
  var blob = new Blob([JSON.stringify(orders, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "ordini-backup-"+todayISO()+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("Backup scaricato");
}
function importData(ev){
  var file = ev.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error("formato");
      if(STORE !== localStore){ toast("In modalit\u00e0 cloud il ripristino non serve"); ev.target.value=""; return; }
      orders = data;
      localStore.persist(); applyOrders(orders);
      toast("Ripristinati "+data.length+" ordini");
    }catch(err){ toast("File non valido"); }
    ev.target.value = "";
  };
  reader.readAsText(file);
}

/* ---------- TOAST ---------- */
var toastTimer = null;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2000);
}

/* ---------- INIT ---------- */
function init(){
  STORE = window.store || localStore;
  document.getElementById("search").addEventListener("input", render);
  document.getElementById("overlay").addEventListener("click", function(e){
    if(e.target === this) closeForm();
  });
  var modeEl=document.getElementById("mode");
  if(modeEl) modeEl.innerHTML = (window.appConfigured ? '<span style="color:#2f7d32">\u25cf</span> Cloud attivo \u00b7 ordini dai clienti in tempo reale' : '<span style="color:#b3261e">\u25cf</span> Offline \u00b7 solo questo dispositivo');
  STORE.init(applyOrders);
}
if(typeof document !== "undefined" && document.addEventListener){
  document.addEventListener("DOMContentLoaded", init);
}

/* export pure functions for testing (node) */
if(typeof module !== "undefined" && module.exports){
  module.exports = {
    pad, dateToISO, todayISO, addDaysISO, classifyBucket, compareOrders,
    computeStats, nextStatus, statoLabel, formatDateHuman, matchesQuery,
    buildWhatsAppMessage, cleanPhone, waLink, groupOrders
  };
}

              creato:(x.creato&&x.creato.toMillis)?x.creato.toMillis():(x.creato||0)
            });
          });
          onChange(arr);
        }, function(err){ console.error("Firestore:", err); });
      },
      add:function(o){ return addDoc(col,{cliente:o.cliente,prodotti:o.prodotti,ritiro:o.ritiro,ora:o.ora,telefono:o.tel||"",note:o.note||"",stato:"da_preparare",origine:"banco",nuovo:false,creato:serverTimestamp()}); },
